[project]
name = "lp-sourcing"
version = "0.1.0"
description = "Classify, enrich, and prioritize potential LP and family office investors for Thryve fundraising outreach."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lp_sourcing"]

[tool.ruff]
line-length = 100
